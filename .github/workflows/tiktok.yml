name: TikTok Cloud Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          mkdir -p "$HOME/.local/bin"

          # rclone
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"

          # FFmpeg
          curl -fsSL https://johnvansickle.com/ffmpeg/builds/ffmpeg-git-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-git-*-amd64-static/ffmpeg "$HOME/.local/bin/ffmpeg"
          cp /tmp/ffmpeg-git-*-amd64-static/ffprobe "$HOME/.local/bin/ffprobe"
          chmod +x "$HOME/.local/bin/ffmpeg" "$HOME/.local/bin/ffprobe"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          rclone version
          ffmpeg -version | head -1
          yt-dlp --version
          gallery-dl --version

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        shell: bash
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
            "beylinyuc"
            "zaraaa_.333"
            "likkunii"
            "_elisabedii"
            "ketaats"
          )

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "========================================"
            echo "Checking @$USERNAME"
            echo "========================================"

            FOLDER="$HOME/tiktok/$USERNAME"

            VIDEO_ARCHIVE="$FOLDER/archive.txt"
            PHOTO_ARCHIVE="$FOLDER/photo_archive.sqlite3"
            START_FILE="$FOLDER/start_epoch.txt"

            PHOTO_STAGING="$FOLDER/.photo_staging"

            mkdir -p "$FOLDER"
            mkdir -p "$PHOTO_STAGING"

            # ==========================================
            # RESTORE ORIGINAL MONITORING START TIME
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              "$START_FILE" \
              2>/dev/null
            then
              echo "Existing monitoring start time found."
            else
              echo "First time monitoring @$USERNAME"

              date +%s > "$START_FILE"

              rclone copyto \
                "$START_FILE" \
                "gdrive:TikTok/$USERNAME/start_epoch.txt"
            fi

            START_EPOCH="$(tr -d '[:space:]' < "$START_FILE")"

            echo "Monitoring posts after timestamp: $START_EPOCH"

            # ==========================================
            # RESTORE VIDEO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              "$VIDEO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing video archive found."
            else
              echo "No video archive found."
              touch "$VIDEO_ARCHIVE"
            fi

            # ==========================================
            # RESTORE PHOTO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
              "$PHOTO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing photo archive found."
            else
              echo "No photo archive yet."
              rm -f "$PHOTO_ARCHIVE"
            fi

            # ==========================================
            # YT-DLP PROFILE SOURCE
            # ==========================================

            if [ "$USERNAME" = "sarahmeelo_" ]; then
              TIKTOK_SOURCE="tiktokuser:MS4wLjABAAAAWyawaDoAYYBtTOSpopcEEAaQhKQ16lpyAmWCtLhMxXfqXhFbFdNxj71s40tIUYaV"
            else
              TIKTOK_SOURCE="https://www.tiktok.com/@$USERNAME"
            fi

            PROFILE_URL="https://www.tiktok.com/@$USERNAME"

            # ==========================================
            # NORMAL VIDEOS
            # ==========================================

            echo ""
            echo "Checking normal video posts..."

            yt-dlp \
              --impersonate chrome \
              --ignore-errors \
              --no-abort-on-error \
              --continue \
              --no-overwrites \
              --download-archive "$VIDEO_ARCHIVE" \
              --match-filters "timestamp >= $START_EPOCH" \
              --format "bv*+ba/b" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(upload_date)s_%(id)s/%(upload_date)s_%(id)s.%(ext)s" \
              "$TIKTOK_SOURCE" \
              || echo "WARNING: yt-dlp could not fully process @$USERNAME"

            # ==========================================
            # REMOVE AUDIO-ONLY FILES CREATED BY
            # TIKTOK PHOTO/SLIDESHOW POSTS
            # ==========================================

            echo ""
            echo "Removing slideshow audio..."

            find "$FOLDER" -type f \( \
              -iname "*.mp3" -o \
              -iname "*.m4a" -o \
              -iname "*.aac" -o \
              -iname "*.opus" -o \
              -iname "*.ogg" \
            \) -delete

            # ==========================================
            # PHOTO / SLIDESHOW POSTS
            #
            # gallery-dl:
            #   photos = yes
            #   videos = no
            #   audio  = no
            #
            # Each image is initially written as:
            #
            # POSTID_01.jpg
            # POSTID_02.jpg
            # POSTID_03.jpg
            # ==========================================

            echo ""
            echo "Checking photo/slideshow posts..."

            gallery-dl \
              --date-after "$START_EPOCH" \
              --download-archive "$PHOTO_ARCHIVE" \
              -D "$PHOTO_STAGING" \
              -f "{id}_{num:>02}.{extension}" \
              -o tiktok.photos=true \
              -o tiktok.videos=false \
              -o tiktok.audio=false \
              -o tiktok.covers=false \
              "$PROFILE_URL" \
              || echo "WARNING: gallery-dl could not fully process @$USERNAME"

            # ==========================================
            # ORGANISE SLIDESHOW IMAGES
            #
            # 123456789_01.jpg
            # 123456789_02.jpg
            #
            # becomes:
            #
            # 123456789/
            #   01.jpg
            #   02.jpg
            # ==========================================

            echo ""
            echo "Organising slideshow images..."

            if [ -d "$PHOTO_STAGING" ]; then

              find "$PHOTO_STAGING" -maxdepth 1 -type f -print0 |
              while IFS= read -r -d '' FILE; do

                BASENAME="$(basename "$FILE")"

                POST_ID="${BASENAME%%_*}"
                IMAGE_NAME="${BASENAME#*_}"

                if [[ "$POST_ID" =~ ^[0-9]+$ ]]; then

                  POST_FOLDER="$FOLDER/$POST_ID"

                  mkdir -p "$POST_FOLDER"

                  mv "$FILE" "$POST_FOLDER/$IMAGE_NAME"

                  echo "Saved:"
                  echo "$POST_FOLDER/$IMAGE_NAME"

                else

                  echo "WARNING: Could not identify post ID for:"
                  echo "$BASENAME"

                fi

              done

            fi

            rm -rf "$PHOTO_STAGING"

            # ==========================================
            # REMOVE EMPTY DIRECTORIES
            # ==========================================

            find "$FOLDER" -type d -empty -delete 2>/dev/null || true

            # ==========================================
            # UPLOAD MEDIA TO GOOGLE DRIVE
            # ==========================================

            echo ""
            echo "Uploading media for @$USERNAME..."

            rclone copy \
              "$FOLDER" \
              "gdrive:TikTok/$USERNAME" \
              --exclude "archive.txt" \
              --exclude "photo_archive.sqlite3" \
              --exclude "start_epoch.txt" \
              --exclude ".photo_staging/**" \
              || echo "Media upload failed for @$USERNAME"

            # ==========================================
            # SAVE YT-DLP VIDEO ARCHIVE
            # ==========================================

            rclone copyto \
              "$VIDEO_ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              || echo "Video archive upload failed for @$USERNAME"

            # ==========================================
            # SAVE GALLERY-DL PHOTO ARCHIVE
            # ==========================================

            if [ -f "$PHOTO_ARCHIVE" ]; then

              rclone copyto \
                "$PHOTO_ARCHIVE" \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                || echo "Photo archive upload failed for @$USERNAME"

            fi

            # ==========================================
            # SAVE START TIME
            # ==========================================

            rclone copyto \
              "$START_FILE" \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              || echo "Start-time upload failed for @$USERNAME"

            echo ""
            echo "Finished @$USERNAME"

          done
