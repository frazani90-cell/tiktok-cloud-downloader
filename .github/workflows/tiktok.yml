name: TikTok Cloud Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip jq

          mkdir -p "$HOME/.local/bin"

          # Install latest rclone
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "Installed versions:"
          rclone version
          ffmpeg -version | head -1
          yt-dlp --version
          gallery-dl --version
          jq --version

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        shell: bash
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
            "beylinyuc"
            "zaraaa_.333"
            "likkunii"
            "_elisabedii"
            "ketaats"
            "_alessandraliuofficial"
            "brillantinosa.reb"
            "maria.cleuza.pere30"
            "mancho_atskarunashvili"
          )

          # Last 4 usernames receive an additional historical
          # Top 10 most-viewed video scan.
          TOP10_USERS=(
            "_alessandraliuofficial"
            "brillantinosa.reb"
            "maria.cleuza.pere30"
            "mancho_atskarunashvili"
          )

          BASE_FOLDER="$HOME/tiktok"
          mkdir -p "$BASE_FOLDER"

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "========================================"
            echo "Checking @$USERNAME"
            echo "========================================"

            FOLDER="$BASE_FOLDER/$USERNAME"

            VIDEO_ARCHIVE="$FOLDER/archive.txt"
            PHOTO_ARCHIVE="$FOLDER/photo_archive.sqlite3"
            START_FILE="$FOLDER/start_epoch.txt"
            TOP10_DONE="$FOLDER/top10_done.txt"

            mkdir -p "$FOLDER"

            # ==========================================
            # IS THIS A TOP-10 PROFILE?
            # ==========================================

            IS_TOP10_USER=false

            for TOP_USER in "${TOP10_USERS[@]}"; do
              if [ "$USERNAME" = "$TOP_USER" ]; then
                IS_TOP10_USER=true
                break
              fi
            done

            if [ "$IS_TOP10_USER" = true ]; then
              echo "Historical Top 10 enabled for @$USERNAME"
            fi

            # ==========================================
            # RESTORE START TIME
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              "$START_FILE" \
              2>/dev/null
            then
              echo "Existing monitoring start time found."
            else
              echo "First time monitoring @$USERNAME"

              date +%s > "$START_FILE"

              rclone copyto \
                "$START_FILE" \
                "gdrive:TikTok/$USERNAME/start_epoch.txt"
            fi

            START_EPOCH="$(tr -d '[:space:]' < "$START_FILE")"

            echo "Monitoring normal new posts after timestamp: $START_EPOCH"

            # ==========================================
            # RESTORE VIDEO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              "$VIDEO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing video archive found."
            else
              echo "No video archive found."
              touch "$VIDEO_ARCHIVE"
            fi

            # ==========================================
            # RESTORE PHOTO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
              "$PHOTO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing photo archive found."
            else
              echo "No photo archive found yet."
              rm -f "$PHOTO_ARCHIVE"
            fi

            # ==========================================
            # RESTORE TOP-10 COMPLETION MARKER
            # ==========================================

            if [ "$IS_TOP10_USER" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/top10_done.txt" \
                "$TOP10_DONE" \
                2>/dev/null
              then
                echo "Historical Top 10 already completed."
              else
                echo "Historical Top 10 not completed yet."
                rm -f "$TOP10_DONE"
              fi

            fi

            # ==========================================
            # SELECT TIKTOK SOURCE
            # ==========================================

            if [ "$USERNAME" = "sarahmeelo_" ]; then
              TIKTOK_SOURCE="tiktokuser:MS4wLjABAAAAWyawaDoAYYBtTOSpopcEEAaQhKQ16lpyAmWCtLhMxXfqXhFbFdNxj71s40tIUYaV"
            else
              TIKTOK_SOURCE="https://www.tiktok.com/@$USERNAME"
            fi

            PROFILE_URL="https://www.tiktok.com/@$USERNAME"

            # ==========================================
            # NORMAL NEW VIDEO POSTS
            #
            # These respect START_EPOCH.
            #
            # Files remain flat:
            #
            # 20260930_POSTID.mp4
            # ==========================================

            echo ""
            echo "Checking normal new videos..."

            yt-dlp \
              --impersonate chrome \
              --ignore-errors \
              --no-abort-on-error \
              --continue \
              --no-overwrites \
              --download-archive "$VIDEO_ARCHIVE" \
              --match-filters "timestamp >= $START_EPOCH" \
              --format "bv*+ba/b" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
              "$TIKTOK_SOURCE" \
              || echo "WARNING: yt-dlp could not fully process @$USERNAME"

            # ==========================================
            # HISTORICAL TOP 10 BY VIEWS
            #
            # LAST FOUR USERS ONLY.
            #
            # START_EPOCH IS NOT USED HERE.
            #
            # Entire accessible profile is inspected.
            # Actual video posts are ranked by views.
            #
            # Top 10 are downloaded.
            #
            # Runs once unless top10_done.txt is deleted.
            # ==========================================

            if [ "$IS_TOP10_USER" = true ] && [ ! -f "$TOP10_DONE" ]; then

              echo ""
              echo "========================================"
              echo "Historical Top 10 scan for @$USERNAME"
              echo "========================================"

              TOP10_META="/tmp/${USERNAME}_all_posts.jsonl"
              TOP10_LIST="/tmp/${USERNAME}_top10.tsv"

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

              echo "Scanning full accessible profile..."

              yt-dlp \
                --impersonate chrome \
                --ignore-errors \
                --no-abort-on-error \
                --skip-download \
                --dump-json \
                "$TIKTOK_SOURCE" \
                > "$TOP10_META" \
                || true

              # Build:
              #
              # views<TAB>url
              #
              # Slideshows/audio-only entries are excluded.

              if [ -s "$TOP10_META" ]; then

                jq -r -s '
                  map(
                    . as $item
                    | (.webpage_url // .original_url // .url) as $post_url
                    | select(.id != null)
                    | select($post_url != null)
                    | select(.view_count != null)
                    | select(
                        any(
                          .formats[]?;
                          (
                            .vcodec != null
                            and .vcodec != "none"
                          )
                        )
                      )
                    | {
                        id: .id,
                        views: (.view_count // 0),
                        timestamp: (.timestamp // 0),
                        url: $post_url
                      }
                  )
                  | unique_by(.id)
                  | sort_by(.views, .timestamp)
                  | reverse
                  | .[:10][]
                  | [
                      (.views | tostring),
                      .url
                    ]
                  | @tsv
                ' "$TOP10_META" > "$TOP10_LIST"

              else

                touch "$TOP10_LIST"

              fi

              TOP10_FOUND="$(wc -l < "$TOP10_LIST" | tr -d '[:space:]')"

              echo ""
              echo "Historical videos selected: $TOP10_FOUND"

              ALL_TOP10_OK=1

              if [ "$TOP10_FOUND" -gt 0 ]; then

                POSITION=0

                while IFS=$'\t' read -r VIEWS TOP_URL; do

                  POSITION=$((POSITION + 1))

                  echo ""
                  echo "----------------------------------------"
                  echo "Top video #$POSITION"
                  echo "Views: $VIEWS"
                  echo "URL: $TOP_URL"
                  echo "----------------------------------------"

                  # No epoch filter here.
                  #
                  # download-archive is still used so an
                  # already-downloaded video is not duplicated.

                  if yt-dlp \
                    --impersonate chrome \
                    --continue \
                    --no-overwrites \
                    --download-archive "$VIDEO_ARCHIVE" \
                    --format "bv*[vcodec!=none]+ba/b[vcodec!=none]" \
                    --merge-output-format mp4 \
                    --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
                    "$TOP_URL"
                  then

                    echo "Top video #$POSITION processed."

                  else

                    echo "WARNING: Top video #$POSITION failed."
                    ALL_TOP10_OK=0

                  fi

                done < "$TOP10_LIST"

              else

                echo "WARNING: No historical video posts with view counts found."
                ALL_TOP10_OK=0

              fi

              # Only create completion marker after
              # successful processing.

              if [ "$ALL_TOP10_OK" -eq 1 ] && [ "$TOP10_FOUND" -gt 0 ]; then

                {
                  echo "username=$USERNAME"
                  echo "completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "videos_selected=$TOP10_FOUND"
                } > "$TOP10_DONE"

                echo ""
                echo "Historical Top 10 completed for @$USERNAME"

              else

                echo ""
                echo "Historical Top 10 incomplete."
                echo "It will retry next run."

              fi

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

            elif [ "$IS_TOP10_USER" = true ]; then

              echo ""
              echo "Historical Top 10 already completed for @$USERNAME"

            fi

            # ==========================================
            # REMOVE AUDIO-ONLY FILES
            #
            # This removes soundtrack files generated
            # from TikTok slideshow/photo posts.
            # ==========================================

            find "$FOLDER" -maxdepth 1 -type f \( \
              -iname "*.mp3" -o \
              -iname "*.m4a" -o \
              -iname "*.aac" -o \
              -iname "*.opus" -o \
              -iname "*.ogg" \
            \) -delete

            # ==========================================
            # PHOTO / SLIDESHOW POSTS
            #
            # Normal epoch rules still apply.
            #
            # Flat structure:
            #
            # 20260930_POSTID_01.jpg
            # 20260930_POSTID_02.jpg
            # 20260930_POSTID_03.jpg
            #
            # No slideshow folders.
            # No slideshow audio.
            # ==========================================

            echo ""
            echo "Checking photo/slideshow posts..."

            gallery-dl \
              --date-after "$START_EPOCH" \
              --download-archive "$PHOTO_ARCHIVE" \
              -D "$FOLDER" \
              -f "{date:%Y%m%d}_{id}_{num:>02}.{extension}" \
              -o tiktok.photos=true \
              -o tiktok.videos=false \
              -o tiktok.audio=false \
              -o tiktok.covers=false \
              "$PROFILE_URL" \
              || echo "WARNING: gallery-dl could not fully process @$USERNAME"

            # ==========================================
            # REMOVE ANY AUDIO AGAIN
            # ==========================================

            find "$FOLDER" -maxdepth 1 -type f \( \
              -iname "*.mp3" -o \
              -iname "*.m4a" -o \
              -iname "*.aac" -o \
              -iname "*.opus" -o \
              -iname "*.ogg" \
            \) -delete

            # ==========================================
            # COUNT NEW MEDIA DOWNLOADED THIS RUN
            #
            # GitHub runner starts clean.
            #
            # We restore tracking files only, not old
            # media, so media present locally represents
            # files obtained during this run.
            # ==========================================

            NEW_MEDIA_COUNT="$(
              find "$FOLDER" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname "*.mp4" -o \
                  -iname "*.mov" -o \
                  -iname "*.mkv" -o \
                  -iname "*.webm" -o \
                  -iname "*.jpg" -o \
                  -iname "*.jpeg" -o \
                  -iname "*.png" -o \
                  -iname "*.webp" -o \
                  -iname "*.avif" \
                \) \
                | wc -l
            )"

            NEW_MEDIA_COUNT="$(echo "$NEW_MEDIA_COUNT" | tr -d '[:space:]')"

            echo ""
            echo "New media files found for @$USERNAME: $NEW_MEDIA_COUNT"

            # ==========================================
            # UPLOAD NEW MEDIA
            #
            # Everything remains directly inside the
            # username folder.
            #
            # No per-post directories.
            #
            # Username folder modification time is
            # touched only when media exists.
            # ==========================================

            if [ "$NEW_MEDIA_COUNT" -gt 0 ]; then

              echo ""
              echo "New content found for @$USERNAME"
              echo "Uploading media..."

              touch "$FOLDER"

              rclone copy \
                "$BASE_FOLDER" \
                "gdrive:TikTok" \
                --filter "- /$USERNAME/archive.txt" \
                --filter "- /$USERNAME/photo_archive.sqlite3" \
                --filter "- /$USERNAME/photo_archive.sqlite3-wal" \
                --filter "- /$USERNAME/photo_archive.sqlite3-shm" \
                --filter "- /$USERNAME/start_epoch.txt" \
                --filter "- /$USERNAME/top10_done.txt" \
                --filter "+ /$USERNAME/" \
                --filter "+ /$USERNAME/**" \
                --filter "- /**" \
                || echo "Media upload failed for @$USERNAME"

              echo "Media uploaded."
              echo "Profile folder timestamp refreshed."

            else

              echo ""
              echo "No new media for @$USERNAME"
              echo "Profile folder timestamp left unchanged."

            fi

            # ==========================================
            # SAVE VIDEO ARCHIVE
            # ==========================================

            rclone copyto \
              "$VIDEO_ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              || echo "Video archive upload failed for @$USERNAME"

            # ==========================================
            # SAVE PHOTO ARCHIVE
            # ==========================================

            if [ -f "$PHOTO_ARCHIVE" ]; then

              rclone copyto \
                "$PHOTO_ARCHIVE" \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                || echo "Photo archive upload failed for @$USERNAME"

            fi

            # ==========================================
            # SAVE START EPOCH
            # ==========================================

            rclone copyto \
              "$START_FILE" \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              || echo "Start-time upload failed for @$USERNAME"

            # ==========================================
            # SAVE TOP-10 COMPLETION MARKER
            # ==========================================

            if [ "$IS_TOP10_USER" = true ] && [ -f "$TOP10_DONE" ]; then

              rclone copyto \
                "$TOP10_DONE" \
                "gdrive:TikTok/$USERNAME/top10_done.txt" \
                || echo "Top-10 marker upload failed for @$USERNAME"

            fi

            echo ""
            echo "Finished @$USERNAME"

          done
