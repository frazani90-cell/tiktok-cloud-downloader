name: TikTok Cloud Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          mkdir -p "$HOME/.local/bin"

          # rclone
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"

          # FFmpeg
          curl -fsSL https://johnvansickle.com/ffmpeg/builds/ffmpeg-git-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-git-*-amd64-static/ffmpeg "$HOME/.local/bin/ffmpeg"
          cp /tmp/ffmpeg-git-*-amd64-static/ffprobe "$HOME/.local/bin/ffprobe"
          chmod +x "$HOME/.local/bin/ffmpeg" "$HOME/.local/bin/ffprobe"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          rclone version
          ffmpeg -version | head -1
          yt-dlp --version
          gallery-dl --version

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        shell: bash
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
            "beylinyuc"
            "zaraaa_.333"
            "likkunii"
            "_elisabedii"
            "ketaats"
            "_alessandraliuofficial"
            
          )

          BASE_FOLDER="$HOME/tiktok"
          mkdir -p "$BASE_FOLDER"

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "========================================"
            echo "Checking @$USERNAME"
            echo "========================================"

            FOLDER="$BASE_FOLDER/$USERNAME"

            VIDEO_ARCHIVE="$FOLDER/archive.txt"
            PHOTO_ARCHIVE="$FOLDER/photo_archive.sqlite3"
            START_FILE="$FOLDER/start_epoch.txt"

            mkdir -p "$FOLDER"

            # ==========================================
            # RESTORE ORIGINAL MONITORING START TIME
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              "$START_FILE" \
              2>/dev/null
            then
              echo "Existing monitoring start time found."
            else
              echo "First time monitoring @$USERNAME"

              date +%s > "$START_FILE"

              rclone copyto \
                "$START_FILE" \
                "gdrive:TikTok/$USERNAME/start_epoch.txt"
            fi

            START_EPOCH="$(tr -d '[:space:]' < "$START_FILE")"

            echo "Monitoring posts after timestamp: $START_EPOCH"

            # ==========================================
            # RESTORE YT-DLP VIDEO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              "$VIDEO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing video archive found."
            else
              echo "No video archive found."
              touch "$VIDEO_ARCHIVE"
            fi

            # ==========================================
            # RESTORE GALLERY-DL PHOTO ARCHIVE
            # ==========================================

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
              "$PHOTO_ARCHIVE" \
              2>/dev/null
            then
              echo "Existing photo archive found."
            else
              echo "No photo archive found yet."
              rm -f "$PHOTO_ARCHIVE"
            fi

            # ==========================================
            # SELECT YT-DLP SOURCE
            # ==========================================

            if [ "$USERNAME" = "sarahmeelo_" ]; then
              TIKTOK_SOURCE="tiktokuser:MS4wLjABAAAAWyawaDoAYYBtTOSpopcEEAaQhKQ16lpyAmWCtLhMxXfqXhFbFdNxj71s40tIUYaV"
            else
              TIKTOK_SOURCE="https://www.tiktok.com/@$USERNAME"
            fi

            PROFILE_URL="https://www.tiktok.com/@$USERNAME"

            # ==========================================
            # DOWNLOAD NORMAL VIDEOS
            #
            # Flat structure:
            # 20260930_123456789.mp4
            # ==========================================

            echo ""
            echo "Checking normal video posts..."

            yt-dlp \
              --impersonate chrome \
              --ignore-errors \
              --no-abort-on-error \
              --continue \
              --no-overwrites \
              --download-archive "$VIDEO_ARCHIVE" \
              --match-filters "timestamp >= $START_EPOCH" \
              --format "bv*+ba/b" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
              "$TIKTOK_SOURCE" \
              || echo "WARNING: yt-dlp could not fully process @$USERNAME"

            # ==========================================
            # REMOVE AUDIO FROM PHOTO/SLIDESHOW POSTS
            # ==========================================

            find "$FOLDER" -maxdepth 1 -type f \( \
              -iname "*.mp3" -o \
              -iname "*.m4a" -o \
              -iname "*.aac" -o \
              -iname "*.opus" -o \
              -iname "*.ogg" \
            \) -delete

            # ==========================================
            # DOWNLOAD PHOTO / SLIDESHOW POSTS
            #
            # Photos only.
            # Videos disabled.
            # Audio disabled.
            #
            # Flat filenames:
            #
            # 20260930_POSTID_01.jpg
            # 20260930_POSTID_02.jpg
            # 20260930_POSTID_03.jpg
            # ==========================================

            echo ""
            echo "Checking photo/slideshow posts..."

            gallery-dl \
              --date-after "$START_EPOCH" \
              --download-archive "$PHOTO_ARCHIVE" \
              -D "$FOLDER" \
              -f "{date:%Y%m%d}_{id}_{num:>02}.{extension}" \
              -o tiktok.photos=true \
              -o tiktok.videos=false \
              -o tiktok.audio=false \
              -o tiktok.covers=false \
              "$PROFILE_URL" \
              || echo "WARNING: gallery-dl could not fully process @$USERNAME"

            # ==========================================
            # REMOVE ANY AUDIO AGAIN JUST IN CASE
            # ==========================================

            find "$FOLDER" -maxdepth 1 -type f \( \
              -iname "*.mp3" -o \
              -iname "*.m4a" -o \
              -iname "*.aac" -o \
              -iname "*.opus" -o \
              -iname "*.ogg" \
            \) -delete

            # ==========================================
            # CHECK WHETHER NEW MEDIA WAS DOWNLOADED
            #
            # The GitHub runner starts clean each run.
            # Therefore media inside this folder represents
            # media downloaded during THIS run.
            # ==========================================

            NEW_MEDIA_COUNT="$(
              find "$FOLDER" -maxdepth 1 -type f \( \
                -iname "*.mp4" -o \
                -iname "*.mov" -o \
                -iname "*.mkv" -o \
                -iname "*.webm" -o \
                -iname "*.jpg" -o \
                -iname "*.jpeg" -o \
                -iname "*.png" -o \
                -iname "*.webp" -o \
                -iname "*.avif" \
              \) | wc -l
            )"

            NEW_MEDIA_COUNT="$(echo "$NEW_MEDIA_COUNT" | tr -d '[:space:]')"

            echo ""
            echo "New media files found: $NEW_MEDIA_COUNT"

            # ==========================================
            # UPLOAD MEDIA
            #
            # IMPORTANT:
            #
            # We copy from BASE_FOLDER -> gdrive:TikTok
            # instead of FOLDER -> gdrive:TikTok/USERNAME.
            #
            # This makes USERNAME a subdirectory from
            # rclone's perspective, allowing rclone to
            # synchronize that folder's modification time.
            # ==========================================

            if [ "$NEW_MEDIA_COUNT" -gt 0 ]; then

              echo ""
              echo "New content found for @$USERNAME"
              echo "Updating Google Drive folder modification time."

              # Set local username folder timestamp to now.
              touch "$FOLDER"

              rclone copy \
                "$BASE_FOLDER" \
                "gdrive:TikTok" \
                --filter "- /$USERNAME/archive.txt" \
                --filter "- /$USERNAME/photo_archive.sqlite3" \
                --filter "- /$USERNAME/photo_archive.sqlite3-wal" \
                --filter "- /$USERNAME/photo_archive.sqlite3-shm" \
                --filter "- /$USERNAME/start_epoch.txt" \
                --filter "+ /$USERNAME/" \
                --filter "+ /$USERNAME/**" \
                --filter "- /**" \
                || echo "Media upload failed for @$USERNAME"

            else

              echo "No new media for @$USERNAME"
              echo "Google Drive folder timestamp will remain unchanged."

            fi

            # ==========================================
            # SAVE YT-DLP ARCHIVE
            # ==========================================

            rclone copyto \
              "$VIDEO_ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              || echo "Video archive upload failed for @$USERNAME"

            # ==========================================
            # SAVE GALLERY-DL PHOTO ARCHIVE
            # ==========================================

            if [ -f "$PHOTO_ARCHIVE" ]; then

              rclone copyto \
                "$PHOTO_ARCHIVE" \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                || echo "Photo archive upload failed for @$USERNAME"

            fi

            # ==========================================
            # SAVE START TIME
            # ==========================================

            rclone copyto \
              "$START_FILE" \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              || echo "Start-time upload failed for @$USERNAME"

            echo ""
            echo "Finished @$USERNAME"

          done
