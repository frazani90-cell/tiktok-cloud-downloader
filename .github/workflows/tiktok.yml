name: TikTok Cloud Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Download new TikTok videos
        run: |
          USERNAME="sarahmelo_"
          mkdir -p "$HOME/tiktok/$USERNAME"

          rclone copyto \
            "gdrive:TikTok/$USERNAME/archive.txt" \
            "$HOME/tiktok/$USERNAME/archive.txt" \
            2>/dev/null || true

          touch "$HOME/tiktok/$USERNAME/archive.txt"

          yt-dlp \
            --ignore-errors \
            --no-abort-on-error \
            --continue \
            --no-overwrites \
            --download-archive "$HOME/tiktok/$USERNAME/archive.txt" \
            --format "bv*+ba/b" \
            --merge-output-format mp4 \
            --output "$HOME/tiktok/$USERNAME/%(upload_date)s_%(id)s.%(ext)s" \
            "https://www.tiktok.com/@$USERNAME"

      - name: Upload to Google Drive
        if: always()
        run: |
          USERNAME="sarahmelo_"

          rclone copy \
            "$HOME/tiktok/$USERNAME" \
            "gdrive:TikTok/$USERNAME" \
            --exclude "archive.txt"

          rclone copyto \
            "$HOME/tiktok/$USERNAME/archive.txt" \
            "gdrive:TikTok/$USERNAME/archive.txt"
