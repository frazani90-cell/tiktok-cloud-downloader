name: TikTok Cloud Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
          )

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "=============================="
            echo "Checking @$USERNAME"
            echo "=============================="

            FOLDER="$HOME/tiktok/$USERNAME"
            ARCHIVE="$FOLDER/archive.txt"

            mkdir -p "$FOLDER"

            if rclone copyto \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              "$ARCHIVE"
            then

              echo "Archive found for @$USERNAME"
              echo "Downloading only new videos..."

              yt-dlp \
                --ignore-errors \
                --no-abort-on-error \
                --continue \
                --no-overwrites \
                --download-archive "$ARCHIVE" \
                --format "bv*+ba/b" \
                --merge-output-format mp4 \
                --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
                "https://www.tiktok.com/@$USERNAME"

            else

              echo "No archive found for @$USERNAME"
              echo "Creating baseline without downloading existing videos..."

              touch "$ARCHIVE"

              yt-dlp \
                --ignore-errors \
                --no-abort-on-error \
                --skip-download \
                --force-write-archive \
                --download-archive "$ARCHIVE" \
                "https://www.tiktok.com/@$USERNAME"

            fi

            echo "Uploading new files for @$USERNAME..."

            rclone copy \
              "$FOLDER" \
              "gdrive:TikTok/$USERNAME" \
              --exclude "archive.txt"

            rclone copyto \
              "$ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt"

          done
