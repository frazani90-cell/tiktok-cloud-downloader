name: TikTok Cloud Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: tiktok-cloud-downloader
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip jq

          mkdir -p "$HOME/.local/bin"

          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "Installed versions:"
          rclone version
          ffmpeg -version | head -1
          yt-dlp --version
          gallery-dl --version
          jq --version

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        shell: bash
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
            "beylinyuc"
            "zaraaa_.333"
            "likkunii"
            "_elisabedii"
            "ketaats"
            "_alessandraliuofficial"
            "brillantinosa.reb"
            "maria.cleuza.pere30"
            "mancho_atskarunashvili"
            "indieee_pretty"
            "allysofia26"
            "hindsidki2"
            "vanessa.silva32754"
            "anne.oconnor7"
            "secret_acc_67_0"
            "dneskaceerozbijem"
            "mariacarmella93614"
            "yourfavblonds2"
            "lorene_715"
            "salmalaoukili601"
          )

          RECENT_LIMIT=30

          BASE_FOLDER="$HOME/tiktok"
          mkdir -p "$BASE_FOLDER"

          # Get the Drive folder list once instead of making
          # the same request separately for every username.
          REMOTE_DIRS="$(
            rclone lsf \
              "gdrive:TikTok" \
              --dirs-only \
              2>/dev/null || true
          )"

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "========================================"
            echo "Checking @$USERNAME"
            echo "========================================"

            FOLDER="$BASE_FOLDER/$USERNAME"
            VIDEO_ARCHIVE="$FOLDER/archive.txt"
            PHOTO_ARCHIVE="$FOLDER/photo_archive.sqlite3"
            START_FILE="$FOLDER/start_epoch.txt"

            mkdir -p "$FOLDER"

            # ==========================================
            # CHECK WHETHER REMOTE PROFILE EXISTS
            # ==========================================

            REMOTE_FOLDER_EXISTS=false

            if printf '%s\n' "$REMOTE_DIRS" | grep -Fxq "$USERNAME/"; then
              REMOTE_FOLDER_EXISTS=true
            fi

            FIRST_RUN_USER=false

            if [ "$REMOTE_FOLDER_EXISTS" = false ]; then

              FIRST_RUN_USER=true

              echo ""
              echo "NEW PROFILE DETECTED: @$USERNAME"
              echo "Historical Top 10 will run."

            else

              echo "Existing Google Drive folder found."

            fi

            # ==========================================
            # RESTORE / CREATE START EPOCH
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/start_epoch.txt" \
                "$START_FILE" \
                2>/dev/null
              then
                echo "Existing monitoring start time found."
              else
                echo "No start time found. Creating one."
                date +%s > "$START_FILE"
              fi

            else

              echo "Creating first monitoring start time."
              date +%s > "$START_FILE"

            fi

            START_EPOCH="$(tr -d '[:space:]' < "$START_FILE")"

            echo "Monitoring posts after timestamp: $START_EPOCH"

            # ==========================================
            # RESTORE VIDEO ARCHIVE
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/archive.txt" \
                "$VIDEO_ARCHIVE" \
                2>/dev/null
              then
                echo "Existing video archive found."
              else
                echo "No video archive found."
                touch "$VIDEO_ARCHIVE"
              fi

            else

              touch "$VIDEO_ARCHIVE"

            fi

            # ==========================================
            # RESTORE PHOTO ARCHIVE
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                "$PHOTO_ARCHIVE" \
                2>/dev/null
              then
                echo "Existing photo archive found."
              else
                rm -f "$PHOTO_ARCHIVE"
              fi

            else

              rm -f "$PHOTO_ARCHIVE"

            fi

            # ==========================================
            # SELECT SOURCE
            # ==========================================

            if [ "$USERNAME" = "sarahmeelo_" ]; then

              TIKTOK_SOURCE="tiktokuser:MS4wLjABAAAAWyawaDoAYYBtTOSpopcEEAaQhKQ16lpyAmWCtLhMxXfqXhFbFdNxj71s40tIUYaV"

            else

              TIKTOK_SOURCE="https://www.tiktok.com/@$USERNAME"

            fi

            PROFILE_URL="https://www.tiktok.com/@$USERNAME"

            # ==========================================
            # FIRST-RUN HISTORICAL TOP 10
            #
            # ONLY users without a Drive folder.
            #
            # This remains a COMPLETE profile scan
            # because otherwise we cannot know the
            # actual 10 most-viewed videos.
            # ==========================================

            if [ "$FIRST_RUN_USER" = true ]; then

              echo ""
              echo "========================================"
              echo "HISTORICAL TOP 10 FOR @$USERNAME"
              echo "========================================"

              TOP10_META="/tmp/${USERNAME}_all_posts.jsonl"
              TOP10_LIST="/tmp/${USERNAME}_top10.tsv"

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

              echo "Scanning full accessible profile..."

              yt-dlp \
                --impersonate chrome \
                --ignore-errors \
                --no-abort-on-error \
                --skip-download \
                --dump-json \
                "$TIKTOK_SOURCE" \
                > "$TOP10_META" \
                || echo "::warning::Historical metadata scan had errors for @$USERNAME"

              if [ -s "$TOP10_META" ]; then

                jq -r -s '
                  map(
                    select(.id != null)
                    | select(.view_count != null)
                    | select(
                        any(
                          .formats[]?;
                          (
                            .vcodec != null
                            and .vcodec != "none"
                          )
                        )
                      )
                    | {
                        id: .id,
                        views: (.view_count // 0),
                        timestamp: (.timestamp // 0)
                      }
                  )
                  | unique_by(.id)
                  | sort_by(.views, .timestamp)
                  | reverse
                  | .[:10][]
                  | [
                      (.views | tostring),
                      .id
                    ]
                  | @tsv
                ' "$TOP10_META" > "$TOP10_LIST"

              else

                touch "$TOP10_LIST"

              fi

              TOP10_FOUND="$(
                wc -l < "$TOP10_LIST" |
                tr -d '[:space:]'
              )"

              echo "Historical videos selected: $TOP10_FOUND"

              if [ "$TOP10_FOUND" -gt 0 ]; then

                POSITION=0

                while IFS=$'\t' read -r VIEWS VIDEO_ID; do

                  POSITION=$((POSITION + 1))

                  TOP_URL="https://www.tiktok.com/@$USERNAME/video/$VIDEO_ID"

                  echo ""
                  echo "Top video #$POSITION"
                  echo "Views: $VIEWS"
                  echo "Video ID: $VIDEO_ID"

                  if ! yt-dlp \
                    --impersonate chrome \
                    --continue \
                    --no-overwrites \
                    --download-archive "$VIDEO_ARCHIVE" \
                    --format "bv*[vcodec!=none]+ba/b[vcodec!=none]" \
                    --merge-output-format mp4 \
                    --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
                    "$TOP_URL"
                  then
                    echo "::warning::Top video #$POSITION failed for @$USERNAME"
                  fi

                done < "$TOP10_LIST"

              else

                echo "::warning::No historical videos with view counts found for @$USERNAME"

              fi

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

            fi

            # ==========================================
            # NORMAL RECURRING VIDEO CHECK
            #
            # ONLY inspect latest 30 posts.
            #
            # Best available real video quality.
            # ==========================================

            echo ""
            echo "Checking latest $RECENT_LIMIT video posts..."

            if ! yt-dlp \
              --playlist-end "$RECENT_LIMIT" \
              --impersonate chrome \
              --ignore-errors \
              --no-abort-on-error \
              --continue \
              --no-overwrites \
              --download-archive "$VIDEO_ARCHIVE" \
              --match-filters "timestamp >= $START_EPOCH" \
              --format "bv*[vcodec!=none]+ba/b[vcodec!=none]" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
              "$TIKTOK_SOURCE"
            then

              echo "::warning::yt-dlp recurring check had errors for @$USERNAME"

            fi

            # ==========================================
            # REMOVE AUDIO-ONLY FILES
            # ==========================================

            find "$FOLDER" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" -o \
                -iname "*.m4a" -o \
                -iname "*.aac" -o \
                -iname "*.opus" -o \
                -iname "*.ogg" \
              \) \
              -delete

            # ==========================================
            # PHOTO / SLIDESHOW CHECK
            #
            # ONLY latest 30 posts.
            # ==========================================

            echo ""
            echo "Checking latest $RECENT_LIMIT photo/slideshow posts..."

            if ! gallery-dl \
              --post-range "1-$RECENT_LIMIT" \
              --date-after "$START_EPOCH" \
              --download-archive "$PHOTO_ARCHIVE" \
              -D "$FOLDER" \
              -f "{date:%Y%m%d}_{id}_{num:>02}.{extension}" \
              -o tiktok.photos=true \
              -o tiktok.videos=false \
              -o tiktok.audio=false \
              -o tiktok.covers=false \
              "$PROFILE_URL"
            then

              echo "::warning::gallery-dl check had errors for @$USERNAME"

            fi

            # ==========================================
            # REMOVE AUDIO AGAIN
            # ==========================================

            find "$FOLDER" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" -o \
                -iname "*.m4a" -o \
                -iname "*.aac" -o \
                -iname "*.opus" -o \
                -iname "*.ogg" \
              \) \
              -delete

            # ==========================================
            # COUNT MEDIA DOWNLOADED THIS RUN
            # ==========================================

            NEW_MEDIA_COUNT="$(
              find "$FOLDER" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname "*.mp4" -o \
                  -iname "*.mov" -o \
                  -iname "*.mkv" -o \
                  -iname "*.webm" -o \
                  -iname "*.jpg" -o \
                  -iname "*.jpeg" -o \
                  -iname "*.png" -o \
                  -iname "*.webp" -o \
                  -iname "*.avif" \
                \) \
                | wc -l
            )"

            NEW_MEDIA_COUNT="$(
              echo "$NEW_MEDIA_COUNT" |
              tr -d '[:space:]'
            )"

            echo ""
            echo "New media files for @$USERNAME: $NEW_MEDIA_COUNT"

            # ==========================================
            # UPLOAD NEW MEDIA
            # ==========================================

            if [ "$NEW_MEDIA_COUNT" -gt 0 ]; then

              echo "Uploading new media for @$USERNAME..."

              touch "$FOLDER"

              if ! rclone copy \
                "$BASE_FOLDER" \
                "gdrive:TikTok" \
                --filter "- /$USERNAME/archive.txt" \
                --filter "- /$USERNAME/photo_archive.sqlite3" \
                --filter "- /$USERNAME/photo_archive.sqlite3-wal" \
                --filter "- /$USERNAME/photo_archive.sqlite3-shm" \
                --filter "- /$USERNAME/start_epoch.txt" \
                --filter "+ /$USERNAME/" \
                --filter "+ /$USERNAME/**" \
                --filter "- /**"
              then

                echo "::warning::Media upload failed for @$USERNAME"

              fi

              echo "Media upload stage finished."

            else

              echo "No new media for @$USERNAME"

            fi

            # ==========================================
            # SAVE STATE FILES
            # ==========================================

            if ! rclone copyto \
              "$VIDEO_ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt"
            then
              echo "::warning::Video archive upload failed for @$USERNAME"
            fi

            if [ -f "$PHOTO_ARCHIVE" ]; then

              if ! rclone copyto \
                "$PHOTO_ARCHIVE" \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3"
              then
                echo "::warning::Photo archive upload failed for @$USERNAME"
              fi

            fi

            if ! rclone copyto \
              "$START_FILE" \
              "gdrive:TikTok/$USERNAME/start_epoch.txt"
            then
              echo "::warning::Start epoch upload failed for @$USERNAME"
            fi

            echo ""
            echo "Finished @$USERNAME"

          done
