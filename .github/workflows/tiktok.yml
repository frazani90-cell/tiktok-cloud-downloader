name: TikTok Cloud Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip jq

          mkdir -p "$HOME/.local/bin"

          # Install latest rclone
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo "Installed versions:"
          rclone version
          ffmpeg -version | head -1
          yt-dlp --version
          gallery-dl --version
          jq --version

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Check TikTok accounts
        shell: bash
        run: |
          USERNAMES=(
            "_.meli._06"
            "sarahmeelo_"
            "beylinyuc"
            "zaraaa_.333"
            "likkunii"
            "_elisabedii"
            "ketaats"
            "_alessandraliuofficial"
            "brillantinosa.reb"
            "maria.cleuza.pere30"
            "mancho_atskarunashvili"
            "indieee_pretty"
            "allysofia26"
            "hindsidki2"
            "vanessa.silva32754"
            "anne.oconnor7"
            "secret_acc_67_0"
            "dneskaceerozbijem"
          )

          BASE_FOLDER="$HOME/tiktok"
          mkdir -p "$BASE_FOLDER"

          for USERNAME in "${USERNAMES[@]}"; do

            echo ""
            echo "========================================"
            echo "Checking @$USERNAME"
            echo "========================================"

            FOLDER="$BASE_FOLDER/$USERNAME"

            VIDEO_ARCHIVE="$FOLDER/archive.txt"
            PHOTO_ARCHIVE="$FOLDER/photo_archive.sqlite3"
            START_FILE="$FOLDER/start_epoch.txt"

            mkdir -p "$FOLDER"

            # ==========================================
            # CHECK WHETHER THIS USER ALREADY HAS
            # A GOOGLE DRIVE FOLDER
            #
            # ANY username without a remote folder
            # receives the historical Top 10.
            # ==========================================

            REMOTE_FOLDER_EXISTS=false

            if rclone lsf \
              "gdrive:TikTok" \
              --dirs-only \
              2>/dev/null \
              | grep -Fxq "$USERNAME/"
            then
              REMOTE_FOLDER_EXISTS=true
            fi

            FIRST_RUN_USER=false

            if [ "$REMOTE_FOLDER_EXISTS" = false ]; then

              FIRST_RUN_USER=true

              echo ""
              echo "NEW PROFILE DETECTED: @$USERNAME"
              echo "No Google Drive folder exists."
              echo "Historical Top 10 most-viewed videos will be downloaded."

            else

              echo ""
              echo "Existing Google Drive folder found."
              echo "Historical Top 10 will not run."

            fi

            # ==========================================
            # RESTORE OR CREATE START EPOCH
            #
            # IMPORTANT:
            #
            # For a completely new user we create the
            # start epoch LOCALLY first.
            #
            # We do NOT upload it immediately because
            # doing that would create the remote folder
            # before the first-run Top 10 finishes.
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/start_epoch.txt" \
                "$START_FILE" \
                2>/dev/null
              then

                echo "Existing monitoring start time found."

              else

                echo "No start time found. Creating one."
                date +%s > "$START_FILE"

              fi

            else

              echo "Creating first monitoring start time."
              date +%s > "$START_FILE"

            fi

            START_EPOCH="$(tr -d '[:space:]' < "$START_FILE")"

            echo "Monitoring normal new posts after timestamp: $START_EPOCH"

            # ==========================================
            # RESTORE VIDEO ARCHIVE
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/archive.txt" \
                "$VIDEO_ARCHIVE" \
                2>/dev/null
              then

                echo "Existing video archive found."

              else

                echo "No video archive found."
                touch "$VIDEO_ARCHIVE"

              fi

            else

              echo "Creating new video archive."
              touch "$VIDEO_ARCHIVE"

            fi

            # ==========================================
            # RESTORE PHOTO ARCHIVE
            # ==========================================

            if [ "$REMOTE_FOLDER_EXISTS" = true ]; then

              if rclone copyto \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                "$PHOTO_ARCHIVE" \
                2>/dev/null
              then

                echo "Existing photo archive found."

              else

                echo "No photo archive found yet."
                rm -f "$PHOTO_ARCHIVE"

              fi

            else

              rm -f "$PHOTO_ARCHIVE"

            fi

            # ==========================================
            # SELECT TIKTOK SOURCE
            # ==========================================

            if [ "$USERNAME" = "sarahmeelo_" ]; then

              TIKTOK_SOURCE="tiktokuser:MS4wLjABAAAAWyawaDoAYYBtTOSpopcEEAaQhKQ16lpyAmWCtLhMxXfqXhFbFdNxj71s40tIUYaV"

            else

              TIKTOK_SOURCE="https://www.tiktok.com/@$USERNAME"

            fi

            PROFILE_URL="https://www.tiktok.com/@$USERNAME"

            # ==========================================
            # NORMAL NEW VIDEOS
            #
            # This applies to EVERY profile.
            #
            # START_EPOCH is respected here.
            #
            # Flat structure:
            #
            # 20260930_POSTID.mp4
            # ==========================================

            echo ""
            echo "Checking normal new videos..."

            yt-dlp \
              --impersonate chrome \
              --ignore-errors \
              --no-abort-on-error \
              --continue \
              --no-overwrites \
              --download-archive "$VIDEO_ARCHIVE" \
              --match-filters "timestamp >= $START_EPOCH" \
              --format "bv*+ba/b" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
              "$TIKTOK_SOURCE" \
              || echo "WARNING: yt-dlp could not fully process @$USERNAME"

            # ==========================================
            # HISTORICAL TOP 10 MOST-VIEWED VIDEOS
            #
            # Runs for ANY USERNAME whose Google Drive
            # folder did not exist when this run began.
            #
            # Completely ignores START_EPOCH.
            #
            # Only actual video posts are considered.
            # Photo slideshows are excluded.
            # ==========================================

            if [ "$FIRST_RUN_USER" = true ]; then

              echo ""
              echo "========================================"
              echo "FIRST-RUN HISTORICAL TOP 10"
              echo "@$USERNAME"
              echo "========================================"

              TOP10_META="/tmp/${USERNAME}_all_posts.jsonl"
              TOP10_LIST="/tmp/${USERNAME}_top10.tsv"

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

              echo ""
              echo "Scanning full accessible profile..."
              echo "No epoch restriction."

              # ========================================
              # GET METADATA FOR ENTIRE PROFILE
              # ========================================

              yt-dlp \
                --impersonate chrome \
                --ignore-errors \
                --no-abort-on-error \
                --skip-download \
                --dump-json \
                "$TIKTOK_SOURCE" \
                > "$TOP10_META" \
                || true

              # ========================================
              # SELECT 10 MOST-VIEWED REAL VIDEOS
              #
              # Result:
              #
              # VIEWS<TAB>VIDEO_ID
              # ========================================

              if [ -s "$TOP10_META" ]; then

                jq -r -s '
                  map(
                    select(.id != null)
                    | select(.view_count != null)

                    | select(
                        any(
                          .formats[]?;
                          (
                            .vcodec != null
                            and .vcodec != "none"
                          )
                        )
                      )

                    | {
                        id: .id,
                        views: (.view_count // 0),
                        timestamp: (.timestamp // 0)
                      }
                  )

                  | unique_by(.id)

                  | sort_by(
                      .views,
                      .timestamp
                    )

                  | reverse

                  | .[:10][]

                  | [
                      (.views | tostring),
                      .id
                    ]

                  | @tsv
                ' "$TOP10_META" > "$TOP10_LIST"

              else

                touch "$TOP10_LIST"

              fi

              TOP10_FOUND="$(
                wc -l < "$TOP10_LIST" |
                tr -d '[:space:]'
              )"

              echo ""
              echo "Historical videos selected: $TOP10_FOUND"

              # ========================================
              # DOWNLOAD TOP 10
              # ========================================

              if [ "$TOP10_FOUND" -gt 0 ]; then

                POSITION=0

                while IFS=$'\t' read -r VIEWS VIDEO_ID; do

                  POSITION=$((POSITION + 1))

                  TOP_URL="https://www.tiktok.com/@$USERNAME/video/$VIDEO_ID"

                  echo ""
                  echo "----------------------------------------"
                  echo "Top video #$POSITION"
                  echo "Views: $VIEWS"
                  echo "Video ID: $VIDEO_ID"
                  echo "----------------------------------------"

                  # Deliberately no START_EPOCH filter.

                  yt-dlp \
                    --impersonate chrome \
                    --ignore-errors \
                    --no-abort-on-error \
                    --continue \
                    --no-overwrites \
                    --download-archive "$VIDEO_ARCHIVE" \
                    --format "bv*[vcodec!=none]+ba/b[vcodec!=none]" \
                    --merge-output-format mp4 \
                    --output "$FOLDER/%(upload_date)s_%(id)s.%(ext)s" \
                    "$TOP_URL" \
                    || echo "WARNING: Top video #$POSITION could not be downloaded."

                done < "$TOP10_LIST"

              else

                echo ""
                echo "WARNING: No historical video posts with view counts were found."

              fi

              rm -f "$TOP10_META"
              rm -f "$TOP10_LIST"

              echo ""
              echo "Historical Top 10 stage finished."

            fi

            # ==========================================
            # REMOVE AUDIO-ONLY FILES
            #
            # TikTok slideshows may appear to yt-dlp
            # as audio-only posts.
            # ==========================================

            find "$FOLDER" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" -o \
                -iname "*.m4a" -o \
                -iname "*.aac" -o \
                -iname "*.opus" -o \
                -iname "*.ogg" \
              \) \
              -delete

            # ==========================================
            # PHOTO / SLIDESHOW POSTS
            #
            # START_EPOCH applies normally.
            #
            # Flat structure:
            #
            # 20260930_POSTID_01.jpg
            # 20260930_POSTID_02.jpg
            # 20260930_POSTID_03.jpg
            #
            # No post folders.
            # No audio.
            # ==========================================

            echo ""
            echo "Checking photo/slideshow posts..."

            gallery-dl \
              --date-after "$START_EPOCH" \
              --download-archive "$PHOTO_ARCHIVE" \
              -D "$FOLDER" \
              -f "{date:%Y%m%d}_{id}_{num:>02}.{extension}" \
              -o tiktok.photos=true \
              -o tiktok.videos=false \
              -o tiktok.audio=false \
              -o tiktok.covers=false \
              "$PROFILE_URL" \
              || echo "WARNING: gallery-dl could not fully process @$USERNAME"

            # ==========================================
            # REMOVE AUDIO AGAIN AS SAFETY
            # ==========================================

            find "$FOLDER" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" -o \
                -iname "*.m4a" -o \
                -iname "*.aac" -o \
                -iname "*.opus" -o \
                -iname "*.ogg" \
              \) \
              -delete

            # ==========================================
            # COUNT NEW MEDIA DOWNLOADED THIS RUN
            # ==========================================

            NEW_MEDIA_COUNT="$(
              find "$FOLDER" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname "*.mp4" -o \
                  -iname "*.mov" -o \
                  -iname "*.mkv" -o \
                  -iname "*.webm" -o \
                  -iname "*.jpg" -o \
                  -iname "*.jpeg" -o \
                  -iname "*.png" -o \
                  -iname "*.webp" -o \
                  -iname "*.avif" \
                \) \
                | wc -l
            )"

            NEW_MEDIA_COUNT="$(
              echo "$NEW_MEDIA_COUNT" |
              tr -d '[:space:]'
            )"

            echo ""
            echo "New media files found for @$USERNAME: $NEW_MEDIA_COUNT"

            # ==========================================
            # UPLOAD NEW MEDIA
            #
            # Profile folder remains FLAT.
            #
            # Folder modified time is refreshed only
            # when actual new media exists.
            # ==========================================

            if [ "$NEW_MEDIA_COUNT" -gt 0 ]; then

              echo ""
              echo "New content found for @$USERNAME"
              echo "Uploading media..."

              touch "$FOLDER"

              rclone copy \
                "$BASE_FOLDER" \
                "gdrive:TikTok" \
                --filter "- /$USERNAME/archive.txt" \
                --filter "- /$USERNAME/photo_archive.sqlite3" \
                --filter "- /$USERNAME/photo_archive.sqlite3-wal" \
                --filter "- /$USERNAME/photo_archive.sqlite3-shm" \
                --filter "- /$USERNAME/start_epoch.txt" \
                --filter "+ /$USERNAME/" \
                --filter "+ /$USERNAME/**" \
                --filter "- /**" \
                || echo "Media upload failed for @$USERNAME"

              echo "Media uploaded."
              echo "Google Drive profile folder timestamp refreshed."

            else

              echo ""
              echo "No new media for @$USERNAME"

            fi

            # ==========================================
            # SAVE VIDEO ARCHIVE
            # ==========================================

            rclone copyto \
              "$VIDEO_ARCHIVE" \
              "gdrive:TikTok/$USERNAME/archive.txt" \
              || echo "Video archive upload failed for @$USERNAME"

            # ==========================================
            # SAVE PHOTO ARCHIVE
            # ==========================================

            if [ -f "$PHOTO_ARCHIVE" ]; then

              rclone copyto \
                "$PHOTO_ARCHIVE" \
                "gdrive:TikTok/$USERNAME/photo_archive.sqlite3" \
                || echo "Photo archive upload failed for @$USERNAME"

            fi

            # ==========================================
            # SAVE START EPOCH
            #
            # For a new user this happens only AFTER
            # the Top 10 stage.
            # ==========================================

            rclone copyto \
              "$START_FILE" \
              "gdrive:TikTok/$USERNAME/start_epoch.txt" \
              || echo "Start-time upload failed for @$USERNAME"

            echo ""
            echo "Finished @$USERNAME"

          done
