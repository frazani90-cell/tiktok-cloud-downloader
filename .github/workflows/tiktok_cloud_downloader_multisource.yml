name: TikTok Cloud Downloader

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: tiktok-cloud-downloader
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    concurrency:
      group: tiktok-account-${{ matrix.username }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      max-parallel: 6

      matrix:
        username:
          - "_.meli._06"
          - "sarahmeelo_"
          - "beylinyuc"
          - "zaraaa_.333"
          - "likkunii"
          - "_elisabedii"
          - "ketaats"
          - "_alessandraliuofficial"
          - "brillantinosa.reb"
          - "maria.cleuza.pere30"
          - "mancho_atskarunashvili"
          - "indieee_pretty"
          - "allysofia26"
          - "hindsidki2"
          - "vanessa.silva32754"
          - "anne.oconnor7"
          - "secret_acc_67_0"
          - "dneskaceerozbijem"
          - "mariacarmella93614"
          - "yourfavblonds2"
          - "lorene_715"
          - "salmalaoukili601"
          - "_sarahmeeloo"
          - "saplovesdogs"
          - "milevi5"
          - "a_668ufc"
          - "sara.nigito"
        
          
    env:
      USERNAME: ${{ matrix.username }}
      RECENT_LIMIT: "15"
      # Preserve originals when bitrate/FPS or watermark differences are ambiguous.
      WATERMARK_POLICY: "separate"
      BITRATE_POLICY: "separate"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - name: Verify quality engine is installed
        run: python tiktok_quality_engine.py --help


      # ==================================================
      # INSTALL TOOLS
      # ==================================================

      - name: Install tools
        shell: bash
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]"
          python -m pip install -U gallery-dl

          # Install system tools only if missing.
          MISSING_PACKAGES=()

          command -v ffmpeg >/dev/null 2>&1 || MISSING_PACKAGES+=("ffmpeg")
          command -v unzip  >/dev/null 2>&1 || MISSING_PACKAGES+=("unzip")
          command -v jq     >/dev/null 2>&1 || MISSING_PACKAGES+=("jq")

          if [ "${#MISSING_PACKAGES[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${MISSING_PACKAGES[@]}"
          fi

          mkdir -p "$HOME/.local/bin"
