name: TikTok Weekly Quality Repair

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: tiktok-weekly-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        username:
          - "_.meli._06"
          - "sarahmeelo_"
          - "beylinyuc"
          - "zaraaa_.333"
          - "likkunii"
          - "_elisabedii"
          - "ketaats"
          - "_alessandraliuofficial"
          - "brillantinosa.reb"
          - "maria.cleuza.pere30"
          - "mancho_atskarunashvili"
          - "indieee_pretty"
          - "allysofia26"
          - "hindsidki2"
          - "vanessa.silva32754"
          - "anne.oconnor7"
          - "secret_acc_67_0"
          - "dneskaceerozbijem"
          - "mariacarmella93614"
          - "yourfavblonds2"
          - "lorene_715"
          - "salmalaoukili601"
          - "_sarahmeeloo"
          - "saplovesdogs"
          - "milevi5"
          - "a_668ufc"
          - "sara.nigito"
        
          
    env:
      USERNAME: ${{ matrix.username }}
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        shell: bash
        run: |
          python -m pip install -U --pre "yt-dlp[default,curl-cffi]" gallery-dl
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          chmod +x "$HOME/.local/bin/rclone"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore rclone config
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
      - name: Check and upgrade existing videos
        env:
          REPAIR_BATCH: "5"
        run: |
          python tiktok_quality_engine.py repair --username "$USERNAME" --limit "$REPAIR_BATCH"
