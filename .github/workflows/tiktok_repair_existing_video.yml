name: TikTok Repair Existing Video Quality

on:
  workflow_dispatch:
    inputs:
      username:
        description: TikTok username (without @)
        required: true
        type: string
      video_id:
        description: Numeric TikTok video ID
        required: true
        type: string

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install download and Drive tools
        shell: bash
        run: |
          python -m pip install -U --pre 'yt-dlp[default,curl-cffi]'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          mkdir -p /tmp/rclone "$HOME/.local/bin"
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          cp /tmp/rclone/rclone-*-linux-amd64/rclone "$HOME/.local/bin/rclone"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"

      - name: Redownload and upgrade only if better
        shell: bash
        env:
          USERNAME: ${{ inputs.username }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          set -euo pipefail
          [[ "$USERNAME" =~ ^[A-Za-z0-9._]+$ ]] || { echo 'Invalid username'; exit 1; }
          [[ "$VIDEO_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid video ID'; exit 1; }
          mkdir -p /tmp/tiktok-new /tmp/tiktok-old
          REMOTE="gdrive:TikTok/$USERNAME"
          yt-dlp \
            --impersonate chrome \
            --format 'bv*+ba/b' \
            --format-sort-force \
            --format-sort 'res,fps,vbr,tbr' \
            --merge-output-format mp4 \
            --print 'after_move:SELECTED %(id)s %(resolution)s %(format_id)s %(tbr)s kbps' \
            --output '/tmp/tiktok-new/%(upload_date)s_%(id)s.%(ext)s' \
            "https://www.tiktok.com/@$USERNAME/video/$VIDEO_ID"
          shopt -s nullglob
          files=(/tmp/tiktok-new/*)
          (( ${#files[@]} == 1 )) || { echo 'Expected exactly one downloaded video'; exit 1; }
          NEW="${files[0]}"
          BASE="$(basename "$NEW")"
          mapfile -t OLD_NAMES < <(rclone lsf "$REMOTE" --files-only --max-depth 1 | grep -E "(^|_)${VIDEO_ID}\\.(mp4|mov|mkv|webm)$" || true)
          if (( ${#OLD_NAMES[@]} > 1 )); then
            echo 'Multiple matching files found; stopping to avoid incorrect replacement.'; exit 1
          fi
          if (( ${#OLD_NAMES[@]} == 1 )); then
            OLD_NAME="${OLD_NAMES[0]}"
            rclone copyto "$REMOTE/$OLD_NAME" "/tmp/tiktok-old/$OLD_NAME"
            OLD="/tmp/tiktok-old/$OLD_NAME"
            export NEW OLD
            if ! python3 - <<'PY'
          import json, os, subprocess, sys
          def quality(path):
              info = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',path]))
              vids = [x for x in info['streams'] if x['codec_type'] == 'video']
              if not vids: raise ValueError('No video stream in '+path)
              v=vids[0]
              width,height=int(v.get('width',0)),int(v.get('height',0))
              bitrate=int(v.get('bit_rate') or info['format'].get('bit_rate') or 0)
              return (width*height, bitrate)
          a,b=quality(os.environ['NEW']),quality(os.environ['OLD'])
          print('New pixels/bitrate:',a,'Existing pixels/bitrate:',b)
          if a <= b:
              print('Existing file is as good or better; keeping Drive copy')
              sys.exit(1)
          PY
            then
              exit 0
            fi
            # Preserve existing filename to avoid duplicates or archive inconsistencies.
            rclone copyto "$NEW" "$REMOTE/$OLD_NAME" --ignore-times
          else
            rclone copyto "$NEW" "$REMOTE/$BASE"
          fi
          echo 'Repair complete'
